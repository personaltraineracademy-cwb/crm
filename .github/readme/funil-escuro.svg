<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="O lead anda no funil" aria-describedby="desc">
  <title>O lead anda no funil</title>
  <desc id="desc">Ilustração esquemática de um funil com quatro etapas: Novo, Qualificado, Proposta e Ganho. Um card de lead que veio pelo WhatsApp passa de etapa em etapa, movido pelo agente de IA, até ficar marcado como ganho.</desc>
  <style>
.mover { animation: mover 8s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .vis { animation: vis 8s linear infinite; }
    .ok { animation: ok 8s linear infinite; }
    .ia { animation: ia 8s linear infinite; }
    @keyframes mover {
  0% { transform: translate(0px, 0px); }
  16% { transform: translate(0px, 0px); }
  24% { transform: translate(212px, -6px); }
  26% { transform: translate(212px, 0px); }
  42% { transform: translate(212px, 0px); }
  50% { transform: translate(424px, -6px); }
  52% { transform: translate(424px, 0px); }
  68% { transform: translate(424px, 0px); }
  76% { transform: translate(636px, -6px); }
  78% { transform: translate(636px, 0px); }
  94% { transform: translate(636px, 0px); }
  100% { transform: translate(636px, 0px); }
}
    @keyframes vis {
  0% { opacity: 0; }
  3% { opacity: 1; }
  94% { opacity: 1; }
  98% { opacity: 0; }
  100% { opacity: 0; }
}
    @keyframes ok {
  0% { opacity: 0; }
  79% { opacity: 0; }
  82% { opacity: 1; }
  94% { opacity: 1; }
  98% { opacity: 0; }
  100% { opacity: 0; }
}
    @keyframes ia {
  0% { opacity: 0; }
  17% { opacity: 0; }
  19% { opacity: 1; }
  27% { opacity: 1; }
  29% { opacity: 0; }
  43% { opacity: 0; }
  45% { opacity: 1; }
  53% { opacity: 1; }
  55% { opacity: 0; }
  69% { opacity: 0; }
  71% { opacity: 1; }
  79% { opacity: 1; }
  81% { opacity: 0; }
  100% { opacity: 0; }
}
    @media (prefers-reduced-motion: reduce) {
      .mover, .vis, .ok, .ia { animation: none; }
      .ia, .ok { opacity: 0; }
    }
  </style>
  <rect width="880" height="300" rx="16" fill="#181a1e"/>
  <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" fill="#f3f5f8">O lead anda no funil</text>
  <g class="ia">
    <rect x="684" y="24" width="172" height="28" rx="14" fill="#203750" stroke="#416d98"/>
    <text x="770" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="500" fill="#c6e0ff" text-anchor="middle">o agente de IA moveu</text>
  </g>
  <rect x="24" y="60" width="196" height="200" rx="12" fill="#202328"/>
  <circle cx="44" cy="80" r="4" fill="#78716c"/>
  <text x="56" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#f3f5f8">Novo</text>
  <rect x="36" y="156" width="172" height="44" rx="8" fill="#23262b" stroke="#353a42"/>
  <rect x="48" y="168" width="119" height="8" rx="4" fill="#2d3239"/>
  <rect x="48" y="182" width="69" height="6" rx="3" fill="#2d3239"/>
  <rect x="236" y="60" width="196" height="200" rx="12" fill="#202328"/>
  <circle cx="256" cy="80" r="4" fill="#75b7ff"/>
  <text x="268" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#f3f5f8">Qualificado</text>
  <rect x="248" y="156" width="172" height="44" rx="8" fill="#23262b" stroke="#353a42"/>
  <rect x="260" y="168" width="136" height="8" rx="4" fill="#2d3239"/>
  <rect x="260" y="182" width="80" height="6" rx="3" fill="#2d3239"/>
  <rect x="248" y="210" width="172" height="44" rx="8" fill="#23262b" stroke="#353a42"/>
  <rect x="260" y="222" width="109" height="8" rx="4" fill="#2d3239"/>
  <rect x="260" y="236" width="63" height="6" rx="3" fill="#2d3239"/>
  <rect x="448" y="60" width="196" height="200" rx="12" fill="#202328"/>
  <circle cx="468" cy="80" r="4" fill="#a78bfa"/>
  <text x="480" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#f3f5f8">Proposta</text>
  <rect x="460" y="156" width="172" height="44" rx="8" fill="#23262b" stroke="#353a42"/>
  <rect x="472" y="168" width="103" height="8" rx="4" fill="#2d3239"/>
  <rect x="472" y="182" width="61" height="6" rx="3" fill="#2d3239"/>
  <rect x="660" y="60" width="196" height="200" rx="12" fill="#202328"/>
  <circle cx="680" cy="80" r="4" fill="#34d399"/>
  <text x="692" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#f3f5f8">Ganho</text>
  <rect x="672" y="156" width="172" height="44" rx="8" fill="#23262b" stroke="#353a42"/>
  <rect x="684" y="168" width="120" height="8" rx="4" fill="#2d3239"/>
  <rect x="684" y="182" width="72" height="6" rx="3" fill="#2d3239"/>
  <g class="vis"><g class="mover">
    <rect x="36" y="96" width="172" height="52" rx="8" fill="#23262b" stroke="#75b7ff" stroke-width="2"/>
    <text x="48" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f3f5f8">Novo lead</text>
    <text x="48" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#b4bbc6">veio pelo WhatsApp</text>
    <g class="ok"><circle cx="188" cy="114" r="9" fill="#34d399"/><path d="M183.5,114 l3,3 l5.5,-6" fill="none" stroke="#23262b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g></g>
  <text x="24" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#b4bbc6">Quando a conversa avança, o agente de IA move o lead de etapa. A equipe vê a mudança ao vivo.</text>
</svg>
