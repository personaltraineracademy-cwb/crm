<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="O instalador, passo a passo" aria-describedby="desc">
  <title>O instalador, passo a passo</title>
  <desc id="desc">Ilustração esquemática do terminal: clonar o repositório e rodar o instalador, que confere a VPS, faz as perguntas, gera os segredos, confere o DNS, aplica o banco, cria o administrador, sobe os serviços com HTTPS e confere a saúde.</desc>
